name: Refresh site

on:
  schedule:
    - cron: '17 */3 * * *'   # every three hours
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', 'assets/**', '.github/workflows/refresh.yml']

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch headlines, rankings, birthdays and videos
        run: node scripts/update.mjs
      - name: Rebuild pages
        run: node scripts/build.mjs
      - name: Commit and publish
        run: |
          git config user.name "vip-news-refresh"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Refresh: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
